[build]
  publish = "public"

[functions]
  node_bundler = "esbuild"

# Kurzlinks: merken sich, woher jemand kommt
[[redirects]]
  from = "/warteliste"
  to = "/#warteliste"
  status = 302
[[redirects]]
  from = "/ig"
  to = "/?quelle=ig"
  status = 302
[[redirects]]
  from = "/tt"
  to = "/?quelle=tt"
  status = 302
[[redirects]]
  from = "/li"
  to = "/?quelle=li"
  status = 302
[[redirects]]
  from = "/wa"
  to = "/?quelle=wa"
  status = 302

# Eigene Web-App „Zentrale“ (Vermittlung), gleiche Seite wie /vermittlung
[[redirects]]
  from = "/zentrale"
  to = "/vermittlung"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/crm*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

