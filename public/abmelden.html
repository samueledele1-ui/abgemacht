<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abmelden – Abgemacht</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header><a class="logo" href="/"><span class="mark"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 7.8" fill="none" stroke="#F2B33D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Abgemacht</a></header>
  <section>
    <div class="formbox danke" id="box">
      <h2>Von E-Mails abmelden?</h2>
      <p class="sub">Sie bekommen dann keine E-Mails mehr von uns, und wir löschen Ihre Adresse aus dem Verteiler.</p>
      <button class="btn" id="ok" type="button">Ja, abmelden</button>
      <div class="msg" id="msg" role="status"></div>
    </div>
  </section>
  <footer><span>© 2026 Abgemacht</span><span><a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a></span></footer>
</div>
<script>
(function(){
  var t = new URLSearchParams(location.search).get('t') || '';
  var box = document.getElementById('box'), btn = document.getElementById('ok'), msg = document.getElementById('msg');
  function fertig(titel, text){ box.innerHTML = '<h2>' + titel + '</h2><p class="sub">' + text + '</p><a class="btn ghost" href="/">Zur Startseite</a>'; }
  if (!/^[a-f0-9]{64}$/.test(t)) { fertig('Link ungültig', 'Bitte nutzen Sie den Link aus Ihrer E-Mail oder schreiben Sie uns kurz an samuel.edele1@gmail.com.'); return; }
  btn.addEventListener('click', function(){
    btn.disabled = true; btn.textContent = 'Einen Moment …';
    fetch('/api/abmelden', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ t: t }) })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (!d.ok) throw new Error(d.error || 'Fehler'); fertig('Sie sind abgemeldet', 'Schade, dass Sie gehen. Sie können sich jederzeit wieder eintragen.'); })
      .catch(function(e){ msg.textContent = e.message || 'Das hat nicht geklappt. Bitte versuch es gleich nochmal.'; msg.className = 'msg err'; btn.disabled = false; btn.textContent = 'Ja, abmelden'; });
  });
})();
</script>
</body>
</html>
