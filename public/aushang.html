<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR-Aushang – Abgemacht</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/portal.css">
<style>
/* Layout: ein A4-Blatt zum Ausdrucken, oben Logo, große Überschrift, QR-Code im gelben Rahmen, unten Haus und Verwaltung. Darüber nur am Bildschirm der Druckknopf. */
body{background:var(--flaeche2)}
.leiste2{max-width:210mm;margin:20px auto 12px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:0 16px}
.a4{width:210mm;min-height:297mm;margin:0 auto 40px;background:#fff;color:#14231E;padding:24mm 20mm 18mm;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 20px 50px -30px rgba(0,0,0,.4)}
.a4 .lg{display:flex;align-items:center;gap:10px;font:800 22px/1 var(--f-disp)}
.a4 .lg i{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#138A6B}
.a4 h1{font-size:64px;margin:22mm 0 6mm;line-height:1.02;color:#14231E}
.a4 h1 em{font-style:normal;color:#138A6B}
.a4 p.unter{font-size:24px;color:#4A5A54;margin:0}
.a4 .code{margin:14mm 0 8mm;padding:8mm;border:6px solid #F2B33D;border-radius:28px}
.a4 .code svg{width:90mm;height:90mm;display:block}
.a4 .klein2{font-size:18px;color:#5E6F68}
.a4 .wo{margin-top:auto;width:100%;border-top:2px solid #E4ECE8;padding-top:8mm;font-size:18px;color:#5E6F68}
.a4 .wo b{display:block;font-size:26px;color:#14231E;margin-bottom:4px}
.a4 .not{margin-top:6mm;font-size:16px;color:#5E6F68}
@media (max-width:820px){.a4{width:100%;min-height:0;padding:28px 18px}.a4 h1{font-size:40px;margin-top:28px}.a4 .code svg{width:220px;height:220px}}
@media print{@page{size:A4;margin:0}body{background:#fff}.leiste2{display:none}.a4{box-shadow:none;margin:0;width:210mm;height:297mm}}
</style>
</head>
<body>
<div class="leiste2"><a class="btn s klein" href="/portal">Zurück zum Portal</a><button class="btn p klein" type="button" onclick="print()">Drucken oder als PDF speichern</button></div>
<div class="a4">
  <div class="lg"><i><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 7.8" fill="none" stroke="#F2B33D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Abgemacht</div>
  <h1>Etwas kaputt <em>im Haus?</em></h1>
  <p class="unter">Code scannen, Schaden melden.<br>Ihre Hausverwaltung kümmert sich.</p>
  <div class="code" id="code" role="img" aria-label="QR-Code zur Schadensmeldung"></div>
  <p class="klein2">Ohne App, ohne Anmeldung, mit Foto</p>
  <div class="wo"><b id="haus">…</b><span id="verw"></span></div>
  <p class="not">Bei Gefahr (Gasgeruch, Feuer, Wasserrohrbruch) zuerst 112 oder den Notdienst der Verwaltung anrufen.</p>
</div>
<script src="/qr.js"></script>
<script>
(function () {
  var o = new URLSearchParams(location.search).get('o') || '';
  var link = location.origin + '/melden?o=' + encodeURIComponent(o);
  var q = qrcode(0, 'M'); q.addData(link); q.make();
  document.getElementById('code').innerHTML = q.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
  fetch('/api/melden?o=' + encodeURIComponent(o)).then(function (r) { return r.json(); }).then(function (d) {
    document.getElementById('haus').textContent = d.ok ? (d.adresse && d.adresse.indexOf(d.objekt) === 0 ? d.adresse : d.objekt + (d.adresse && d.adresse !== d.objekt ? ', ' + d.adresse : '')) : 'Unbekanntes Objekt';
    document.getElementById('verw').textContent = d.ok ? d.verwaltung : (d.error || '');
  });
})();
</script>
</body>
</html>
