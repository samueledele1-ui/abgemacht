<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anmeldung bestätigen – Abgemacht</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header><a class="logo" href="/"><span class="mark"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2L18.5 7.8" fill="none" stroke="#F2B33D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Abgemacht</a></header>
  <section>
    <div class="formbox danke" id="box">
      <div class="big"><svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#0D4F3E"/><path d="M17 33l10 10 21-22" fill="none" stroke="#F2B33D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2>Fast geschafft</h2>
      <p class="sub">Ein Klick noch, dann ist Ihre Anmeldung bestätigt.</p>
      <button class="btn" id="ok" type="button">Anmeldung bestätigen</button>
      <div class="msg" id="msg" role="status"></div>
    </div>
  </section>
  <footer><span>© 2026 Abgemacht</span><span><a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a></span></footer>
</div>
<script>
(function(){
  var t = new URLSearchParams(location.search).get('t') || '';
  var box = document.getElementById('box'), btn = document.getElementById('ok'), msg = document.getElementById('msg');
  function fertig(titel, text, umfrage){ box.innerHTML = '<div class="big"><svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#0D4F3E"/><path d="M17 33l10 10 21-22" fill="none" stroke="#F2B33D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h2>' + titel + '</h2><p class="sub">' + text + '</p>' +
    (umfrage ? '<div class="mitreden"><b>Rede mit, was Abgemacht zuerst kann</b><p>9 kurze Fragen, etwa 2 Minuten.</p><a class="btn" href="/umfrage">Zur Umfrage</a></div>' : '') +
    '<a class="btn ghost" href="/">Zur Startseite</a>'; }
  if (!/^[a-f0-9]{64}$/.test(t)) { fertig('Link ungültig', 'Bitte nutzen Sie den Link aus Ihrer E-Mail oder tragen Sie sich neu ein.'); return; }
  btn.addEventListener('click', function(){
    btn.disabled = true; btn.textContent = 'Einen Moment …';
    fetch('/api/bestaetigen', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ t: t }) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok) throw new Error(d.error || 'Fehler');
        fertig('Abgemacht!', d.schon ? 'Sie hatten schon bestätigt. Vielen Dank!' : 'Ihre Anmeldung ist bestätigt. Sie hören von uns, sobald es Neuigkeiten von Abgemacht gibt.', true);
        try { sessionStorage.setItem('hs_wl', '1'); } catch(e) {}
      })
      .catch(function(e){ msg.textContent = e.message || 'Das hat nicht geklappt. Bitte versuch es gleich nochmal.'; msg.className = 'msg err'; btn.disabled = false; btn.textContent = 'Anmeldung bestätigen'; });
  });
})();
</script>
</body>
</html>
